services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: xleuth
      POSTGRES_USER: xleuth_app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - xleuth_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - xleuth_net

  data-ingestion:
    build:
      context: .
      dockerfile: data-ingestion/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - xleuth_net

  backend-api:
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - xleuth_net

  oracle-service:
    build:
      context: .
      dockerfile: oracle-service/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - data-ingestion
    networks:
      - xleuth_net

networks:
  xleuth_net:
    driver: bridge

volumes:
  pgdata: