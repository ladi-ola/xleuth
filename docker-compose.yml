services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xleuth}
      POSTGRES_USER: ${POSTGRES_USER:-xleuth_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - xleuth_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - xleuth_net

  data-ingestion:
    build:
      context: data-ingestion
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xleuth_app}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-xleuth}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - xleuth_net

  backend-api:
    build:
      context: backend-api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xleuth_app}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-xleuth}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - postgres
      - redis
    networks:
      - xleuth_net

  oracle-service:
    build:
      context: oracle-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xleuth_app}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-xleuth}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - data-ingestion
    networks:
      - xleuth_net

  matching-engine:
    build:
      context: matching-engine
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xleuth_app}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-xleuth}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    networks:
      - xleuth_net

networks:
  xleuth_net:
    driver: bridge

volumes:
  pgdata:
