<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Task 6: crawler-visible static defaults (SPA: JS tags can't be seen
      by no-JS scrapers — see use-page-meta.ts). Testnet default is noindex;
      flip with VITE_ROBOTS_CONTENT="index, follow" at build time. -->
    <meta name="robots" content="%VITE_ROBOTS_CONTENT%" />
    <meta name="description" content="Xleuth" />
    <meta name="theme-color" content="#f8f8fa" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var stored = localStorage.getItem("xleuth-theme");
        if (stored && stored.replace(/"/g, "") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Xleuth" />
    <meta property="og:title" content="Xleuth" />
    <meta
      property="og:description"
      content="Trade leveraged index futures on prediction-market baskets. Polygon Amoy testnet, no real funds."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Xleuth" />
    <meta
      name="twitter:description"
      content="Trade leveraged index futures on prediction-market baskets. Polygon Amoy testnet, no real funds."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <title>Xleuth</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
