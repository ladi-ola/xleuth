<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- / is indexable by default. Vercel sends X-Robots-Tag: noindex for
      every non-root route sharing this SPA shell. -->
    <meta name="description" content="Explore dated index futures over prediction-market baskets on Polygon Amoy testnet. Trade with test USDC; no real funds." />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var stored = localStorage.getItem("xleuth-theme");
        if (stored && stored.replace(/"/g, "") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Xleuth" />
    <meta property="og:title" content="Xleuth — prediction-market index futures on testnet" />
    <meta
      property="og:description"
      content="Explore dated index futures over prediction-market baskets on Polygon Amoy testnet. Trade with test USDC; no real funds."
    />
    <meta property="og:image" content="/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Xleuth — prediction-market index futures on testnet" />
    <meta
      name="twitter:description"
      content="Explore dated index futures over prediction-market baskets on Polygon Amoy testnet. Trade with test USDC; no real funds."
    />
    <meta name="twitter:image" content="/favicon.png" />
    <title>Xleuth — prediction-market index futures on testnet</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
